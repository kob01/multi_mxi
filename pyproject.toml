[project]
name = "mxi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=0.3.0,<0.4.0",
    "asyncpg>=0.29.0",
    # 进程内 web 工具(app/tools/web.py): ddgs 免密默认检索 provider, bs4 抽取网页正文;
    # Tavily/Serper 走 httpx REST 直连, 不加 SDK。密钥只住 docker/secrets/*.txt。
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "elasticsearch>=8.0,<9",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jieba>=0.42.1",
    "langchain>=0.3.7",
    "langchain-community>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-deepseek>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-ollama>=0.2.1",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.60",
    # 记忆层: Session Memory/Working State Checkpoint 落 Redis, Long Memory(Graph) 落 Neo4j
    # 注意: langgraph-checkpoint-redis 要求 Redis 侧带 RedisJSON + RediSearch 模块,
    # 因此 compose 中用的是 redis-stack-server 镜像(非裸 redis:alpine)。
    "langgraph-checkpoint-redis>=0.0.5",
    "mcp>=1.10.0,<2",
    # 文档正文外置存储 (MongoDB): 整篇 raw/normalized/structure + 父块全文的唯一事实来源;
    # 异步驱动, 与 asyncpg / AsyncElasticsearch / neo4j async 的技术取向保持一致。
    "motor>=3.6",
    "neo4j>=5.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.2.9",
    "pillow>=10.0.0",
    "psycopg[binary]>=3.1.21",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0.0",
    "redis>=5.0",
    # 进程内文档生成(app/tools/docgen.py): PDF 中文走内置 CID 字体 STSong-Light,
    # 不打包 TTF 字体文件; docx/xlsx/pptx 由 python-docx/openpyxl/python-pptx 覆盖(已有)。
    "reportlab>=4.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

# 本地开发依赖 (不进生产镜像: Dockerfile 使用 `uv sync --no-dev`)
[dependency-groups]
dev = [
    # LangGraph Studio 本地 dev server (内存版 in-memory 后端)
    "langgraph-cli[inmem]>=0.2.0",
    # Windows 下 langgraph dev 的 structlog 彩色控制台渲染器依赖 colorama
    "colorama>=0.4.6",
]

[tool.uv]
# 设置默认镜像源（替代官方 PyPI）
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

# 如果需要额外的镜像源（备用），可以使用 extra-index-url
# extra-index-url = ["https://mirrors.aliyun.com/pypi/simple/"]