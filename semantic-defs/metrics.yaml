  domain: budget
  unit: '%'
  agg: ratio
  source_table: fin_department_budgets
  expression: ROUND(SUM(used_amount) / NULLIF(SUM(annual_budget), 0) * 100, 1)
  compatible_dims:
  - d_budget_department
  - d_budget_year
  calendar: year
  caliber_ref: reports:budget_used_pct_agg
  description: 按分组聚合后的消耗占比(与周报行级口径同值)
  status: active
- metric_id: m_budget_over_count
