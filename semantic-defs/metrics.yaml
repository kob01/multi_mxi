# 智能问数语义层真值(由 scripts/export_semantic_defs.py 生成/维护)
# 改这里 = 改口径: 必须走 scripts/sync_semantic_defs.py 同步进库并留版本记录。
metrics:
- metric_id: m_expense_total
  label: 报销总额
  domain: expense
  unit: 元
  agg: sum
  source_table: fin_reimbursements
  expression: COALESCE(SUM(amount), 0)
  time_column: created_at
  compatible_dims:
  - d_expense_department
  - d_expense_category
  - d_expense_status
  - d_reimb_node
  - d_expense_employee_name
  - d_expense_employee_position
  calendar: month
  caliber_ref: reports:expense_total
  description: 全部状态报销单的金额合计(含待审与驳回)
  status: active
- metric_id: m_expense_count
  label: 报销单数
  domain: expense
  unit: 单
  agg: count
  source_table: fin_reimbursements
  expression: COUNT(*)
  time_column: created_at
  compatible_dims:
  - d_expense_department
  - d_expense_category
  - d_expense_status
  - d_reimb_node
  - d_expense_employee_name
  - d_expense_employee_position
  calendar: month
  caliber_ref: reports:expense_count
  status: active
- metric_id: m_expense_paid_total
  label: 已打款报销金额
  domain: expense
  unit: 元
  agg: sum
  source_table: fin_reimbursements
  expression: COALESCE(SUM(amount) FILTER (WHERE status = 'PAID'), 0)
  time_column: created_at
  compatible_dims:
  - d_expense_department
  - d_expense_category
  - d_expense_status
  - d_reimb_node
  - d_expense_employee_name
  - d_expense_employee_position
  calendar: month
  caliber_ref: reports:expense_paid
  status: active
